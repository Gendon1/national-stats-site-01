<!DOCTYPE html>

  <header>
    <a href="#/" class="header-brand" aria-label="Indonesia National Statistics - Home">

        <path d="M3 3v18h18"/>
        <path d="m19 9-5 5-4-4-3 3"/>

      <div>
        <h1>Indonesia Statistics</h1>

          <path d="m21 21-4.3-4.3"/>

        <input

          autocomplete="off"

        <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>

      <div class="nav-section">
